[package]
name = "hardy-mercury-cla"
description = "Mercury connected ARQ Convergence Layer Adapter for Hardy DTN BPv7"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["dtn", "bpv7", "convergence-layer", "mercury", "amateur-radio"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
serde = ["dep:serde", "hardy-bpa/serde", "hardy-bpv7/serde", "dep:humantime"]

[dependencies]
hardy-async = { version = "0.2", path = "../../hardy/async" }
hardy-bpa = { version = "0.2", path = "../../hardy/bpa", default-features = false, features = ["tokio"] }
hardy-bpv7 = { version = "0.6", path = "../../hardy/bpv7" }
tokio = { version = "1", features = ["macros", "net", "sync", "time", "rt", "io-util"] }
tracing = { version = "0.1", default-features = false }
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"], optional = true }
humantime = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
