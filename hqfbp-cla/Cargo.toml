[package]
name = "hardy-hqfbp-cla"
description = "Hamradio Quick File Broadcasting Protocol (HQFBP) convergence layer adapter for Hardy BPv7"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dtn", "bpv7", "convergence-layer", "hqfbp", "hamradio", "kiss"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = []
serde = ["dep:serde", "hardy-bpa/serde", "hardy-bpv7/serde", "dep:humantime"]
serial = ["dep:tokio-serial"]
instrument = ["tracing/attributes"]

[dependencies]
hardy-async = { version = "0.2", path = "../../hardy/async" }
hardy-bpa = { version = "0.2", path = "../../hardy/bpa" }
hardy-bpv7 = { version = "0.6", path = "../../hardy/bpv7" }
hqfbp-rs = { path = "../../hqfbp-rs" }
tokio = { version = "1", features = ["macros", "net", "sync", "time", "rt", "io-util"] }
tokio-serial = { version = "5", optional = true }
tracing = { version = "0.1", default-features = false }
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"], optional = true }
humantime = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
proptest = "1.6"
rand = "0.8"
serde_json = "1"
