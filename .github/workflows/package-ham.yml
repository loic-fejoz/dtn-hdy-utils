name: Package dtn-hdy-ham

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web Frontend Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dtn-hdy-utils
        uses: actions/checkout@v4
        with:
          path: dtn-hdy-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: dtn-hdy-utils/dtn-hdy-ham/web/pnpm-lock.yaml

      - name: Build Web Frontend
        run: |
          cd dtn-hdy-utils/dtn-hdy-ham/web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ham-web-dist
          path: dtn-hdy-utils/dtn-hdy-ham/web/dist/
          retention-days: 7

  package-ham:
    name: Build Static Binary (${{ matrix.platform }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            binary_name: dtn-hdy-ham
            archive_name: dtn-hdy-ham-linux-x86_64.tar.gz
            format: tar
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary_name: dtn-hdy-ham.exe
            archive_name: dtn-hdy-ham-windows-x86_64.zip
            format: zip
          - os: macos-latest
            platform: macos-universal
            target: universal
            binary_name: dtn-hdy-ham
            archive_name: dtn-hdy-ham-macos-universal.tar.gz
            format: tar

    steps:
      - name: Checkout dtn-hdy-utils
        uses: actions/checkout@v4
        with:
          path: dtn-hdy-utils

      - name: Checkout hardy dependency
        uses: actions/checkout@v4
        with:
          repository: ricktaylor/hardy
          path: hardy
          ref: "260fe751a0d8058d3a438d3b588bc05502bd1727"

      - name: Checkout hqfbp-rs dependency
        uses: actions/checkout@v4
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: "960832ab9e2f6e4f693e4cb7b48d1d7513fd7bec"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux Musl Tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Setup Rust Toolchain (Linux / Windows)
        if: matrix.target != 'universal'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Toolchain (macOS Universal)
        if: matrix.target == 'universal'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Download Web Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: ham-web-dist
          path: dtn-hdy-utils/dtn-hdy-ham/web/dist

      - name: Build Static Binary (Linux Musl)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p dtn-hdy-ham
          mkdir -p bin
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} bin/
          file bin/${{ matrix.binary_name }}
        working-directory: dtn-hdy-utils
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Build Static Binary (Windows MSVC)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p dtn-hdy-ham
          mkdir -p bin
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} bin/
        working-directory: dtn-hdy-utils
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Build Universal Static Binary (macOS)
        if: matrix.target == 'universal'
        run: |
          cargo build --release --target aarch64-apple-darwin -p dtn-hdy-ham
          cargo build --release --target x86_64-apple-darwin -p dtn-hdy-ham
          mkdir -p bin
          lipo -create -output bin/${{ matrix.binary_name }} \
            target/aarch64-apple-darwin/release/${{ matrix.binary_name }} \
            target/x86_64-apple-darwin/release/${{ matrix.binary_name }}
          file bin/${{ matrix.binary_name }}
        working-directory: dtn-hdy-utils

      - name: Assemble Package Directory
        shell: bash
        run: |
          mkdir -p pkg/web/dist
          cp dtn-hdy-utils/bin/${{ matrix.binary_name }} pkg/
          cp -r dtn-hdy-utils/dtn-hdy-ham/web/dist/* pkg/web/dist/
          cp dtn-hdy-utils/examples/test-web.yaml pkg/config.example.yaml
          cp dtn-hdy-utils/README.md pkg/ || true
          ls -la pkg/
          ls -la pkg/web/dist/

      - name: Create Package Archive (tar.gz)
        if: matrix.format == 'tar'
        shell: bash
        run: tar -czf ${{ matrix.archive_name }} -C pkg .

      - name: Create Package Archive (zip)
        if: matrix.format == 'zip'
        shell: pwsh
        run: Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.archive_name }} -Force

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive_name }}
          retention-days: 14
          if-no-files-found: error
