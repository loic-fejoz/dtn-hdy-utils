name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-test-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dtn-hdy-utils
        uses: actions/checkout@v4
        with:
          path: dtn-hdy-utils

      - name: Checkout hardy dependency
        uses: actions/checkout@v4
        with:
          repository: ricktaylor/hardy
          path: hardy
          ref: '260fe751a0d8058d3a438d3b588bc05502bd1727'

      - name: Checkout hqfbp-rs dependency
        uses: actions/checkout@v4
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: '960832ab9e2f6e4f693e4cb7b48d1d7513fd7bec'

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-hdy-utils -> target

      - name: Format Check
        run: cargo fmt --all --check
        working-directory: dtn-hdy-utils

      - name: Clippy Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: dtn-hdy-utils

      - name: Run Tests
        run: cargo test --all-targets
        working-directory: dtn-hdy-utils

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dtn-hdy-utils
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dtn-hdy-utils
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom.spdx.json
            sbom.cdx.json

