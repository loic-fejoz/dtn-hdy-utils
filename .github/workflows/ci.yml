name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  GIT_CONFIG_PARAMETERS: "'init.defaultBranch=main'"

jobs:
  build-test-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dtn-hdy-utils
        uses: actions/checkout@v7
        with:
          path: dtn-hdy-utils

      - name: Checkout hardy dependency
        uses: actions/checkout@v7
        with:
          repository: ricktaylor/hardy
          path: hardy
          ref: '261dd49bc7dbdcd16aaf092bbd5574920f4e3b15'

      - name: Checkout hqfbp-rs dependency
        uses: actions/checkout@v7
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: '960832ab9e2f6e4f693e4cb7b48d1d7513fd7bec'

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-hdy-utils -> target

      - name: Format Check
        run: cargo fmt --check
        working-directory: dtn-hdy-utils

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets --exclude hardy-hqfbp-cla-fuzz --exclude hardy-ltp-cla-fuzz --exclude hardy-ltp-fuzz -- -D warnings
        working-directory: dtn-hdy-utils

      - name: Run Tests
        run: cargo test --workspace --all-targets --exclude hardy-hqfbp-cla-fuzz --exclude hardy-ltp-cla-fuzz --exclude hardy-ltp-fuzz
        working-directory: dtn-hdy-utils

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: dtn-hdy-utils
          format: spdx-json
          output-file: sbom.spdx.json
          config: dtn-hdy-utils/.syft.yaml

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: dtn-hdy-utils
          format: cyclonedx-json
          output-file: sbom.cdx.json
          config: dtn-hdy-utils/.syft.yaml

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-artifacts
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: ignore

  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dtn-hdy-utils
        uses: actions/checkout@v7
        with:
          path: dtn-hdy-utils
          fetch-depth: 0

      - name: Checkout hardy dependency
        uses: actions/checkout@v7
        with:
          repository: ricktaylor/hardy
          path: hardy
          ref: '261dd49bc7dbdcd16aaf092bbd5574920f4e3b15'

      - name: Checkout hqfbp-rs dependency
        uses: actions/checkout@v7
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: '960832ab9e2f6e4f693e4cb7b48d1d7513fd7bec'

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install security scanners (gitleaks, cargo-audit, cargo-deny)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          curl -sSfL https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz | sudo tar -xz -C /usr/local/bin --strip-components=1 cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Run Security & Quality Guardrails
        run: ./scripts/check-security.sh --strict
        working-directory: dtn-hdy-utils

  fuzz-smoke-tests:
    name: Fuzz Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dtn-hdy-utils
        uses: actions/checkout@v7
        with:
          path: dtn-hdy-utils

      - name: Checkout hardy dependency
        uses: actions/checkout@v7
        with:
          repository: ricktaylor/hardy
          path: hardy
          ref: '261dd49bc7dbdcd16aaf092bbd5574920f4e3b15'

      - name: Checkout hqfbp-rs dependency
        uses: actions/checkout@v7
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: '960832ab9e2f6e4f693e4cb7b48d1d7513fd7bec'

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run LTP Fuzz Smoke Test
        run: |
          cargo fuzz run segment_decode -- -max_total_time=15
          cargo fuzz run sdnv_kiss -- -max_total_time=15
        working-directory: dtn-hdy-utils/ltp

      - name: Run HQFBP CLA Fuzz Smoke Test
        run: cargo fuzz run parse_frame -- -max_total_time=15
        working-directory: dtn-hdy-utils/hqfbp-cla

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dtn-hdy-utils
        uses: actions/checkout@v7
        with:
          path: dtn-hdy-utils

      - name: Checkout hardy dependency
        uses: actions/checkout@v7
        with:
          repository: ricktaylor/hardy
          path: hardy
          ref: '261dd49bc7dbdcd16aaf092bbd5574920f4e3b15'

      - name: Checkout hqfbp-rs dependency
        uses: actions/checkout@v7
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: '960832ab9e2f6e4f693e4cb7b48d1d7513fd7bec'

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure Code Coverage
        run: ./scripts/check-coverage.sh --lcov --output-path lcov.info
        working-directory: dtn-hdy-utils

      - name: Upload LCOV Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage-report
          path: dtn-hdy-utils/lcov.info
          if-no-files-found: ignore




