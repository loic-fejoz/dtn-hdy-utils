[package]
name = "hardy-ltp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Licklider Transmission Protocol (LTP, RFC 5326) implementation"
keywords = ["dtn", "ltp", "rfc5326", "kiss", "no-std"]
categories = ["network-programming", "no-std"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["std", "kiss"]
std = ["thiserror/std", "bytes/std"]
serde = ["dep:serde", "serde/alloc"]
kiss = []

[dependencies]
thiserror = { version = "2", default-features = false }
bytes = { version = "1", default-features = false }
memchr = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
licklider-core = "0.1.1"

[[bench]]
name = "ltp_bench"
harness = false
