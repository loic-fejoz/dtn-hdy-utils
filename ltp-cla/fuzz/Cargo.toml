[package]
name = "hardy-ltp-cla-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
hardy-bpa = { version = "0.2", path = "../../../hardy/bpa" }
hardy-bpv7 = { version = "0.6", path = "../../../hardy/bpv7" }
hardy-ltp = { version = "0.1", path = "../../ltp" }
hardy-ltp-cla = { path = ".." }
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }

[lib]
name = "hardy_ltp_cla_fuzz"
path = "src/lib.rs"
test = false
doc = false

[[bin]]
name = "cla_packet"
path = "fuzz_targets/cla_packet.rs"
test = false
bench = false
doc = false
