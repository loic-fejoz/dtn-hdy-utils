# ALSA loopback routing via PulseAudio/PipeWire null sinks for Direwolf dual simulation
pcm.!default {
    type pulse
}
ctl.!default {
    type pulse
}
pcm.direwolf_a_in {
    type pulse
    device "dw_b_tx.monitor"
}
pcm.direwolf_a_out {
    type pulse
    device "dw_a_tx"
}
pcm.direwolf_b_in {
    type pulse
    device "dw_a_tx.monitor"
}
pcm.direwolf_b_out {
    type pulse
    device "dw_b_tx"
}
